function isBg(r,g,b){
  if(r>232&&g>232&&b>232)return true;
  if(b>100&&g<100&&r>70)return true;
  return false;
}
function chromaTrim(img){
  const c=document.createElement("canvas");c.width=img.width;c.height=img.height;
  const g=c.getContext("2d");g.drawImage(img,0,0);
  let d;try{d=g.getImageData(0,0,c.width,c.height);}catch(e){return null;}
  const p=d.data;
  for(let y=c.height-1;y>0;y--){
    let dark=0,tot=0;
    for(let x=0;x<c.width;x+=4){tot++;const i=(y*c.width+x)*4;if(p[i]<70&&p[i+1]<70&&p[i+2]<70)dark++;}
    if(dark>tot*.7){for(let x=0;x<c.width;x++)p[(y*c.width+x)*4+3]=0;}else break;
  }
  let minX=c.width,minY=c.height,maxX=0,maxY=0;
  for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++){
    const i=(y*c.width+x)*4;
    if(isBg(p[i],p[i+1],p[i+2])){p[i+3]=0;continue;}
    if(p[i+3]>10){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;}
  }
  if(maxX<=minX||maxY<=minY)return null;
  g.putImageData(d,0,0);
  const t=document.createElement("canvas");
  t.width=maxX-minX+1;t.height=maxY-minY+1;
  const tg=t.getContext("2d");
  tg.imageSmoothingEnabled=true;tg.imageSmoothingQuality="high";
  tg.drawImage(c,minX,minY,t.width,t.height,0,0,t.width,t.height);
  return t;
}
function assignImg(name,img){
  const n=name.toLowerCase();let key=null;
  if(n.includes("doge")||n.includes("dog"))key="doge";
  else if(n.includes("pepe")||n.includes("frog"))key="pepe";
  else if(n.includes("whale")||n.includes("balena"))key="whale";
  else if(n.includes("bonk"))key="bonk";
  else if(n.includes("wojak"))key="wojak";
  else if(n.includes("floki"))key="floki";
  else if(n.includes("dragon")||n.includes("drago"))key="dragon";
  else if(n.includes("overlord")||n.includes("hell"))key="overlord";
  else if(n.includes("shiba")||n.includes("sprite")||n.includes("comeback")||n.includes("protag"))key="shiba";
  if(!key)return false;
  const t=chromaTrim(img);
  if(t)SPRITES[key]=t;
  return !!t;
}

function glow(c0){

  g.fillStyle=r;g.fillRect(0,0,128,128);
  glowCache[c0]=c;return c;
}

  const r=20,c=document.createElement("canvas");c.width=c.height=96;
  const g=c.getContext("2d");g.translate(48,48);
  const rg=g.createRadialGradient(0,0,2,0,0,r*2.2);
  rg.addColorStop(0,"rgba(20,241,149,.45)");rg.addColorStop(1,"rgba(20,241,149,0)");
  g.fillStyle=rg;g.beginPath();g.arc(0,0,r*2.2,0,7);g.fill();
  const cg=g.createLinearGradient(0,-r,0,r);cg.addColorStop(0,"#9945ff");cg.addColorStop(1,"#14f195");
  g.fillStyle=cg;g.beginPath();g.arc(0,0,r,0,7);g.fill();
  g.lineWidth=2;g.strokeStyle="#eafff5";g.stroke();
  g.fillStyle="#fff";const w2=r*.62,h2=r*.3,s=r*.3;
  function bar(yy,flip){g.beginPath();if(!flip){g.moveTo(-w2+s,yy);g.lineTo(w2,yy);g.lineTo(w2-s,yy+h2);g.lineTo(-w2,yy+h2);}else{g.moveTo(-w2,yy);g.lineTo(w2-s,yy);g.lineTo(w2,yy+h2);g.lineTo(-w2+s,yy+h2);}g.closePath();g.fill();}
  bar(-r*.62,false);bar(-r*.15,true);bar(r*.32,false);
  return c;
})();

let AC=null;
function ensureAC(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();}catch(e){}return AC;}
function beep(f0,f1,dur,type,vol){

  o.type=type||"square";o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);

  o.connect(gn);gn.connect(AC.destination);o.start(t);o.stop(t+dur);}catch(e){}
}

];
function nFreq(n){return 440*Math.pow(2,(n-69)/12);}
function tone(f,t,dur,type,vol){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur);}
function noiseHit(t,vol,dur,f0,f1){
  if(!noiseBuf){noiseBuf=AC.createBuffer(1,Math.floor(AC.sampleRate*.08),AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const s=AC.createBufferSource(),g=AC.createGain();
  s.buffer=noiseBuf;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(g);g.connect(AC.destination);s.start(t);
  if(f0){const o=AC.createOscillator(),og=AC.createGain();o.type="triangle";o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur*.8);og.gain.setValueAtTime(vol,t);og.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(og);og.connect(AC.destination);o.start(t);o.stop(t+dur);}
}
function kick(t,vol){const o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);g.gain.setValueAtTime(vol||.18,t);g.gain.exponentialRampToValueAtTime(.0001,t+.14);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.15);}
function playStep(s,t,ml){
  const note=ml.m[s%ml.m.length];const step60=60/ml.bpm;
  if(note>0)tone(nFreq(note),t,step60*.8,ml.type,ml.type==="sawtooth"?.04:.06);
  if(s%2===0){const bass=ml.b[(s/2)%ml.b.length];if(bass>0)tone(nFreq(bass),t,step60*.95,ml.bass,.12);}

  else if(curLevel===2){if(s%4===0)kick(t,.2);if(s%4===2)noiseHit(t,.16,.12,200,80);}
  else{if(s%8===0)kick(t,.18);if(s%4===2)noiseHit(t,.05,.06,0,0);}
}

function spawnCoins(){

function spawnPower(){

  powersArr.push({type:types[Math.floor(Math.random()*types.length)],x:W+60,y:GROUND-150-Math.random()*110,r:16,got:false,t:Math.random()*6});

function spawnEnemy(){

function burst(x,y,n){

function dust(){for(let i=0;i<8;i++)parts.push({x:player.x+player.w/2+(Math.random()*30-15),y:GROUND-3,vx:-60-Math.random()*120,vy:-40-Math.random()*90,s:3+Math.random()*4,life:.4,max:.4,col:"rgba(159,255,217,.8)"});}
const PWR_LABEL={rocket:"ROCKET! 🚀",shield:"SHIELD! 🛡️",magnet:"MAGNET! 🧲",x2:"SOLANA X2! ✖️2",laser:"LASER EYES! 👀"};
function applyPower(t){
  if(t==="rocket"){powers.rocket=3.2;sndPow(500);}
  else if(t==="shield"){powers.shield=true;sndPow(350);}
  else if(t==="magnet"){powers.magnet=7;sndPow(300);}
  else if(t==="x2"){powers.x2=8;sndPow(600);}

function damageEnemy(e,d){e.hp-=d;e.flash=.15;e.stun=.25;sndHit();
  if(e.hp<=0){e.dead=true;solana+=1;sndKill();burst(e.x+e.w/2,e.y+e.h/2,14);floats.push({x:e.x+e.w/2,y:e.y-6,txt:"+1 ◎",life:.9,col:"#14f195"});}}
function damageBoss(d){if(!boss)return;boss.hp-=d;boss.flash=.15;sndHit();burst(boss.x+boss.w/2,boss.y+boss.h/2,10);if(boss.hp<=0)bossDown();}

  burst(boss.x+boss.w/2,boss.y+boss.h/2,60);solana+=25;

  if(level>=5){state="win";deathTime=tGlobal;if(solana>best){best=solana;try{localStorage.setItem("comebackBest",String(best));}catch(e){}}lbSubmit();}

function hurt(){
  if(powers.shield){powers.shield=false;sndShield();inv=1;floats.push({x:player.x+player.w/2,y:player.y-8,txt:"SHIELD!",life:1,col:"#14f195"});return;}
  hearts--;inv=1.5;sndHurt();burst(player.x+player.w/2,player.y+player.h/2,16);if(hearts<=0)die();
}
function die(){state="over";deathTime=tGlobal;sndDeath();burst(player.x+player.w/2,player.y+player.h/2,36);if(solana>best){best=solana;try{localStorage.setItem("comebackBest",String(best));}catch(e){}}lbSubmit();}
function doJump(){player.vy=JUMP_V;player.on=false;player.sy=1.3;player.sx=.8;sndJump();}

function attack(){
  if(state!=="play"||attackCd>0||powers.rocket>0)return;
  attackCd=.34;attackAnim=.22;
  if(powers.laser>0){beam={y:player.y+16,life:.22};sndLaser();
    enemies.forEach(function(e){if(!e.dead&&e.y<beam.y+14&&e.y+e.h>beam.y-14)damageEnemy(e,2);});
    if(boss&&boss.y<beam.y+40&&boss.y+boss.h>beam.y-40)damageBoss(2);
  }else{
    const hb={x:player.x+player.w-14,y:player.y-24,w:170,h:player.h+40};let hit=false;
    enemies.forEach(function(e){if(!e.dead&&rectsOverlap(hb,e)){damageEnemy(e,2);e.kb=280;hit=true;}});
    if(boss&&rectsOverlap(hb,boss)){damageBoss(2);hit=true;}
    if(hit)burst(player.x+player.w+40,player.y+player.h/2,10);sndPunch();
  }
}

/* ---- UPDATE ---- */
function update(dt){
  tGlobal+=dt;
  if(state==="levelclear"&&tGlobal-lcT>2.4)startLevel(level+1);
  if(beam)beam.life-=dt;
  if(state==="play"){
    elapsed+=dt;speed=speedBase+Math.min(380,elapsed*10);dist+=speed*dt;levelDist+=speed*dt/50;
    bufferT-=dt;inv-=dt;attackCd-=dt;attackAnim-=dt;
    if(powers.rocket>0)powers.rocket-=dt;if(powers.magnet>0)powers.magnet-=dt;
    if(powers.x2>0)powers.x2-=dt;if(powers.laser>0)powers.laser-=dt;
    if(powers.rocket>0){const target=GROUND-240;player.y+=(target-player.y)*Math.min(1,dt*6);player.vy=0;player.on=false;
      if(Math.random()<.6)parts.push({x:player.x-4,y:player.y+player.h-8,vx:-160-Math.random()*120,vy:60+Math.random()*80,s:4+Math.random()*4,life:.4,max:.4,col:Math.random()<.5?"#ff9a3c":"#ffd76a"});
    }else{const wasOn=player.on;player.vy+=GRAV*dt;player.y+=player.vy*dt;
      if(player.y+player.h>=GROUND){player.y=GROUND-player.h;player.vy=0;player.on=true;superUsed=false;
        if(!wasOn){player.sy=.72;player.sx=1.25;dust();}if(bufferT>0){bufferT=0;doJump();}}else player.on=false;}
    player.sx+=(1-player.sx)*Math.min(1,dt*14);player.sy+=(1-player.sy)*Math.min(1,dt*14);
    if(player.on&&Math.random()<dt*7)parts.push({x:player.x+8,y:GROUND-3,vx:-speed*.25,vy:-30-Math.random()*50,s:2.5+Math.random()*3,life:.3,max:.3,col:"rgba(159,255,217,.6)"});
    if(!bossSpawned){
      spawnT-=dt;if(spawnT<=0){if(Math.random()<.45)spawnEnemy();else spawnObstacle();
        const spawnMult=level===5?.5:1-(level-1)*0.16;spawnT=((0.9+Math.random()*0.9)*(560/speed)+0.3)*spawnMult;}
      if(levelDist>=LEVEL_LEN[level-1]){bossSpawned=true;boss=makeBoss(level);sndBoss();}
    }
    coinT-=dt;if(coinT<=0){spawnCoins();coinT=1.1+Math.random()*1.4;}
    powT-=dt;if(powT<=0){spawnPower();powT=6+Math.random()*7;}
    rocketT-=dt;if(rocketT<=0){rockets.push({x:-80,y:50+Math.random()*170,v:220+Math.random()*160});rocketT=2.5+Math.random()*4;}
    obstacles.forEach(function(o){o.x-=speed*dt;});
    coins.forEach(function(c){c.x-=speed*dt;
      if(powers.magnet>0){const dx=(player.x+player.w/2)-c.x,dy=(player.y+player.h/2)-c.y,d=Math.hypot(dx,dy);if(d<260&&d>1){c.x+=dx/d*620*dt;c.y+=dy/d*620*dt;}}});
    powersArr.forEach(function(p){p.x-=speed*dt;});
    rockets.forEach(function(r){r.x+=r.v*dt;});
    enemies.forEach(function(e){e.t+=dt;e.flash-=dt;e.stun-=dt;const chase=e.stun>0?0:e.chase;
      e.x-=(speed*.9+chase)*dt;e.x+=e.kb*dt;e.kb-=e.kb*Math.min(1,dt*6);
      if(e.hop&&e.on&&Math.random()<dt*1.1)e.vy=-520;e.vy+=GRAV*dt;e.y+=e.vy*dt;
      if(e.y+e.h>=GROUND){e.y=GROUND-e.h;e.vy=0;e.on=true;}else e.on=false;
      const pb={x:player.x+6,y:player.y+6,w:player.w-12,h:player.h-10};
      if(!e.dead&&rectsOverlap(pb,e)){if(powers.rocket>0)damageEnemy(e,2);
        else if(player.vy>140&&(player.y+player.h)-e.y<16){damageEnemy(e,2);player.vy=-620;player.sy=1.25;player.sx=.85;}
        else if(inv<=0){hurt();e.kb=240;}}});
    enemies=enemies.filter(function(e){return !e.dead&&e.x>-90;});
    obstacles=obstacles.filter(function(o){return o.x+o.w>-80;});
    coins=coins.filter(function(c){return !c.got&&c.x>-40;});
    powersArr=powersArr.filter(function(p){return !p.got&&p.x>-40;});
    rockets=rockets.filter(function(r){return r.x<W+100;});
    skyline.forEach(function(b){b.x-=speed*dt*.18;if(b.x+b.w<-20)b.x+=W+440;});
    bgCandles.forEach(function(c){c.x-=speed*dt*.35;if(c.x<-30){c.x+=W+280;c.h=40+Math.random()*140;}});
    const px=player.x+8,py=player.y+6,pw=player.w-16,ph=player.h-10;
    if(powers.rocket<=0){for(let i=0;i<obstacles.length;i++){const o=obstacles[i];
      if(px<o.x+o.w-6&&px+pw>o.x+6&&py<o.y+o.h-4&&py+ph>o.y+4){
        if(powers.shield){powers.shield=false;burst(o.x+o.w/2,o.y+o.h/2,26);obstacles.splice(i,1);sndShield();floats.push({x:player.x+player.w/2,y:player.y-8,txt:"SHIELD!",life:1,col:"#14f195"});}
        else{hearts--;inv=1.5;sndHurt();obstacles.splice(i,1);burst(player.x+player.w/2,player.y+player.h/2,16);if(hearts<=0)die();}break;}}}
    if(boss){boss.t+=dt;boss.flash-=dt;
      if(boss.phase==="enter"){boss.x-=220*dt;if(boss.x<=280){boss.x=280;boss.phase="idle";boss.t=0;}}
      else if(boss.phase==="idle"){boss.y=GROUND-boss.h-Math.abs(Math.sin(boss.t*3))*26;if(boss.t>1.6){boss.phase="tele";boss.t=0;}}
      else if(boss.phase==="tele"){boss.x+=60*dt;if(boss.t>0.6){boss.phase="charge";boss.t=0;sndBoss();}}
      else if(boss.phase==="charge"){boss.x-=620*dt;boss.y+=((GROUND-boss.h+8)-boss.y)*Math.min(1,dt*8);if(boss.x<-180){boss.x=W+160;boss.phase="enter";}}
      if(rectsOverlap({x:player.x+6,y:player.y+6,w:player.w-12,h:player.h-10},boss)){
        if(powers.rocket>0)damageBoss(3);
        else if(player.vy>80&&(player.y+player.h)-boss.y<40){damageBoss(2);player.vy=-650;}
        else if(inv<=0)hurt();}}
    const cx=player.x+player.w/2,cy=player.y+player.h/2;
    coins.forEach(function(c){if(!c.got&&Math.abs(c.x-cx)<34&&Math.abs(c.y-cy)<46){
      c.got=true;const v=powers.x2>0?2:1;solana+=v;sndCoin();burst(c.x,c.y,10);
      if(v===2)floats.push({x:c.x,y:c.y-14,txt:"+2",life:.8,col:"#ffd76a"});}});
    powersArr.forEach(function(p){if(!p.got&&Math.abs(p.x-cx)<40&&Math.abs(p.y-cy)<52){p.got=true;applyPower(p.type);burst(p.x,p.y,16);}});
  }
  parts.forEach(function(p){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=900*dt;p.life-=dt;});
  parts=parts.filter(function(p){return p.life>0;});
  floats.forEach(function(f){f.y-=40*dt;f.life-=dt;});
  floats=floats.filter(function(f){return f.life>0;});
}

/* ---- DRAW ---- */
function drawImg(img,cx,feetY,hgt,flip){
  const ar=img.width/img.height;const wdt=hgt*ar;
  ctx.save();ctx.translate(cx,feetY);
  if(flip)ctx.scale(-1,1);
  ctx.drawImage(img,-wdt/2,-hgt,wdt,hgt);
  ctx.restore();
}
const FALLBACK={doge:{c:"#f5c76a",t:"Ð"},pepe:{c:"#5ba35b",t:"P"},bonk:{c:"#ff8c42",t:"B"},wojak:{c:"#b8c4b0",t:"W"},floki:{c:"#a89884",t:"F"},whale:{c:"#3f8fd9",t:"W"},dragon:{c:"#9aa4b2",t:"D"},overlord:{c:"#8b0000",t:"H"},shiba:{c:"#e8963c",t:"$"}};
function drawFallback(type,cx,feetY,hgt){
  const f=FALLBACK[type];const r=hgt/2;const cy=feetY-r;
  const g=ctx.createRadialGradient(cx,cy,2,cx,cy,r);
  g.addColorStop(0,f.c);g.addColorStop(1,"rgba(10,10,20,.35)");
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,.7)";ctx.lineWidth=3;ctx.stroke();
  ctx.fillStyle="#fff";ctx.font="900 "+Math.floor(r*1.1)+"px system-ui";
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(f.t,cx,cy);
  ctx.textBaseline="alphabetic";ctx.textAlign="left";
}
function drawChar(type,cx,feetY,hgt){
  if(SPRITES[type])drawImg(SPRITES[type],cx,feetY,hgt,FLIP[type]);
  else drawFallback(type,cx,feetY,hgt);
}
function drawEnemy(e){
  ctx.save();ctx.translate(e.x+e.w/2,e.y+e.h);
  if(e.flash>0)ctx.globalAlpha=.55;
  drawChar(e.type,0,4,e.h+30);
  ctx.restore();
}
function drawBoss(b){
  ctx.save();ctx.translate(b.x+b.w/2,b.y+b.h);
  if(b.flash>0)ctx.globalAlpha=.6;
  if(b.phase==="tele"&&Math.sin(tGlobal*30)>0)ctx.globalAlpha=.5;
  drawChar(b.type,0,6,b.h+50);
  ctx.restore();
  const bw=220,bx=W/2-bw/2,by=64;
  ctx.fillStyle="rgba(0,0,0,.55)";ctx.fillRect(bx-3,by-3,bw+6,16);
  ctx.fillStyle="#ff5a5a";ctx.fillRect(bx,by,bw*Math.max(0,b.hp/b.maxhp),10);
  ctx.strokeStyle="#fff";ctx.lineWidth=1.5;ctx.strokeRect(bx,by,bw,10);
  ctx.fillStyle="#fff";ctx.font="bold 12px system-ui";ctx.textAlign="center";
  ctx.fillText("BOSS: "+BOSS_NAMES[level-1],W/2,by-8);ctx.textAlign="left";
}
function drawPlayer(){
  const bob=(player.on&&state==="play")?Math.sin(tGlobal*16)*2:0;

  if(state==="over")ctx.rotate(1.35);
  else if(powers.rocket<=0&&!player.on)ctx.rotate(Math.max(-.22,Math.min(.3,player.vy/2600)));

  if(inv>0&&state==="play")ctx.globalAlpha=.45+.4*Math.sin(tGlobal*30);

  else{ctx.fillStyle="#ffd76a";ctx.beginPath();ctx.arc(0,0,r*.9,0,7);ctx.fill();ctx.strokeStyle="#b8860b";ctx.lineWidth=3;ctx.stroke();ctx.fillStyle="#7a4d00";ctx.font="bold "+Math.max(10,Math.floor(r*1.05))+"px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("x2",0,1);}
  ctx.restore();
}
function drawBull(o){

function flamePath(cx,base,w,h){ctx.beginPath();ctx.moveTo(cx-w/2,base);ctx.quadraticCurveTo(cx-w/2,base-h*.45,cx-w*.18,base-h*.62);ctx.quadraticCurveTo(cx-w*.3,base-h*.8,cx,base-h);ctx.quadraticCurveTo(cx+w*.3,base-h*.8,cx+w*.18,base-h*.62);ctx.quadraticCurveTo(cx+w/2,base-h*.45,cx+w/2,base);ctx.closePath();}
function drawFlame(o){const cx=o.x+o.w/2,f=Math.sin(tGlobal*10+o.x)*4;ctx.fillStyle="#ff4d2e";flamePath(cx,GROUND,o.w*.95,o.h+f);ctx.fill();ctx.fillStyle="#ffb020";flamePath(cx,GROUND,o.w*.55,(o.h+f)*.66);ctx.fill();ctx.fillStyle="#ffe97a";flamePath(cx,GROUND,o.w*.28,(o.h+f)*.38);ctx.fill();}
function drawCandle(o){ctx.strokeStyle="#ff5a5a";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(o.x+o.w/2,o.y-14);ctx.lineTo(o.x+o.w/2,o.y+o.h+10);ctx.stroke();ctx.fillStyle="#d92626";ctx.fillRect(o.x,o.y,o.w,o.h);ctx.fillStyle="#ff8080";ctx.fillRect(o.x,o.y,o.w*.3,o.h);}
function drawObstacle(o){if(o.type==="bull")drawBull(o);else if(o.type==="flame")drawFlame(o);else drawCandle(o);}
function drawRocket(r){ctx.save();ctx.translate(r.x,r.y);ctx.rotate(-.45);ctx.fillStyle="#cfe8d8";ctx.beginPath();ctx.ellipse(0,0,16,7,0,0,7);ctx.fill();ctx.fillStyle="#14f195";ctx.beginPath();ctx.moveTo(10,-6);ctx.lineTo(22,0);ctx.lineTo(10,6);ctx.closePath();ctx.fill();ctx.fillStyle="#ff9a3c";ctx.beginPath();ctx.moveTo(-14,-4);ctx.lineTo(-26,0);ctx.lineTo(-14,4);ctx.closePath();ctx.fill();ctx.restore();}
function heart(x,y,s,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x,y+s*.8);ctx.bezierCurveTo(x-s,y+s*.1,x-s*.7,y-s*.8,x,y-s*.25);ctx.bezierCurveTo(x+s*.7,y-s*.8,x+s,y+s*.1,x,y+s*.8);ctx.fill();}
function panel(x,y,w,h){ctx.fillStyle="rgba(8,24,38,.9)";ctx.fillRect(x,y,w,h);ctx.strokeStyle="rgba(20,241,149,.6)";ctx.lineWidth=2;ctx.strokeRect(x,y,w,h);}
function drawHUDPowers(){let hx=W/2-190;const items=[];
  if(powers.rocket>0)items.push(["rocket",powers.rocket]);if(powers.shield)items.push(["shield",0]);
  if(powers.magnet>0)items.push(["magnet",powers.magnet]);if(powers.x2>0)items.push(["x2",powers.x2]);
  if(powers.laser>0)items.push(["laser",powers.laser]);
  items.forEach(function(it){drawPowerIcon(it[0],hx,34,12);if(it[1]>0){ctx.fillStyle="#eafff5";ctx.font="bold 16px system-ui";ctx.textAlign="left";ctx.fillText(Math.ceil(it[1])+"s",hx+18,40);}hx+=80;});}
function iconFist(x,y){
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle="#ffd76a";
  ctx.beginPath();ctx.arc(0,4,11,0,7);ctx.fill();
  for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(-7.5+i*5,-5,4.4,0,7);ctx.fill();}
  ctx.beginPath();ctx.arc(-11,6,4.2,0,7);ctx.fill();
  ctx.strokeStyle="rgba(122,77,0,.6)";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(-11,4);ctx.lineTo(11,4);ctx.stroke();
  ctx.restore();
}
function iconBack(x,y){
  ctx.strokeStyle="#fff";ctx.lineWidth=4;ctx.lineCap="round";ctx.lineJoin="round";
  ctx.beginPath();ctx.moveTo(x+1,y-9);ctx.lineTo(x-8,y);ctx.lineTo(x+1,y+9);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x+10,y-9);ctx.lineTo(x+1,y);ctx.lineTo(x+10,y+9);ctx.stroke();
}
function drawGameButton(x,y,r,col,iconFn,label){
  const g=ctx.createRadialGradient(x,y-r*.4,2,x,y,r);
  g.addColorStop(0,"rgba(30,50,70,.95)");g.addColorStop(1,"rgba(5,10,18,.95)");
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle=col;ctx.stroke();
  ctx.globalAlpha=.45;ctx.lineWidth=1.5;ctx.strokeStyle="#fff";
  ctx.beginPath();ctx.arc(x,y,r-5,0,7);ctx.stroke();
  ctx.globalAlpha=1;
  iconFn(x,y);
  ctx.fillStyle="rgba(255,255,255,.85)";ctx.font="bold 10px system-ui";ctx.textAlign="center";
  ctx.fillText(label,x,y+r+14);ctx.textAlign="left";
}

/* ---- OVERLAYS ---- */
function drawMenu(){
  ctx.fillStyle="rgba(3,10,18,.86)";ctx.fillRect(0,0,W,H);
  ctx.textAlign="center";
  ctx.lineWidth=8;ctx.strokeStyle="#043d22";
  ctx.fillStyle="#14f195";ctx.font="900 50px system-ui";
  ctx.strokeText("$COMEBACK BRAWL",W/2,78);ctx.fillText("$COMEBACK BRAWL",W/2,78);
  ctx.fillStyle="#ffd76a";ctx.font="bold 20px system-ui";
  ctx.fillText("5 levels • Final HELL MODE • music pop→death metal",W/2,108);
  panel(30,132,450,358);
  ctx.textAlign="left";
  ctx.fillStyle="#9fffd9";ctx.font="bold 20px system-ui";ctx.fillText("CONTROLS",50,160);
  ctx.fillStyle="#eafff5";ctx.font="15px system-ui";
  ctx.fillText("• SPACE/TAP = jump • double = SUPER JUMP",50,182);
  ctx.fillText("• X / PUNCH = attack • stomp ON enemies",50,204);
  ctx.fillText("• V = SOLANA BLAST • B = SUPER LASER",50,226);
  ctx.fillText("• ESC / MENU = back to menu • M = music",50,248);
  ctx.fillStyle="#9fffd9";ctx.font="bold 20px system-ui";ctx.fillText("POWER-UPS",50,278);
  const ly=[302,332,362,392,422],kinds=["rocket","shield","magnet","x2","laser"];
  const desc=["ROCKET — invincible flight for 3s","SHIELD — saves you from 1 hit","MAGNET — attracts SOLANA","X2 — doubles SOLANA for 8s","LASER — laser eyes for 6s"];
  for(let i=0;i<5;i++){drawPowerIcon(kinds[i],66,ly[i]-5,10);ctx.fillStyle="#eafff5";ctx.font="14px system-ui";ctx.fillText(desc[i],86,ly[i]);}
  ctx.fillStyle="#ff8080";ctx.font="bold 14px system-ui";
  ctx.fillText("Enemies: DOGE→PEPE→BONK→WOJAK→FLOKI",50,452);
  ctx.fillText("Bosses: WHALE→CYBER DRAGON→OVERLORD",50,472);
  panel(500,132,430,358);
  ctx.fillStyle="#9fffd9";ctx.font="bold 20px system-ui";ctx.fillText("🏆 TOP 5 LEADERBOARD",520,160);
  ctx.fillStyle=lbOnline?"#2ee27a":"#ffd76a";ctx.font="bold 12px system-ui";
  ctx.fillText(lbOnline?"● ONLINE — players saved on your sheet":"● LOCAL — saved on this device only",520,178);
  ctx.fillStyle="#ffd76a";ctx.font="bold 16px system-ui";
  ctx.fillText("You: "+(user?shortName(user.name)+(user.tg?" (Telegram ✓)":""):"—"),520,198);
  const list=API_URL&&lbOnline?lb:lbLocal;
  ctx.font="bold 17px system-ui";
  if(list.length===0){ctx.fillStyle="#eafff5";ctx.fillText("No scores yet: be the first!",520,228);}
  for(let i=0;i<Math.min(5,list.length);i++){
    ctx.fillStyle=i===0?"#ffd76a":"#eafff5";
    ctx.fillText((i+1)+". "+shortName(list[i].name)+"  —  "+list[i].score+" ◎",520,228+i*28);
  }
  ctx.fillStyle="#14f195";ctx.font="bold 15px system-ui";
  ctx.fillText("🚀 Top runners will be rewarded",520,432);
  ctx.fillText("at the $COMEBACK launch!",520,452);
  ctx.textAlign="center";
  ctx.fillStyle=Math.sin(tGlobal*6)>0?"#ffffff":"#9fffd9";
  ctx.font="bold 24px system-ui";
  ctx.fillText("SPACE / TAP to start",W/2,514);
  ctx.textAlign="left";
}
function drawOver(){
  ctx.fillStyle="rgba(3,10,18,.86)";ctx.fillRect(0,0,W,H);
  ctx.textAlign="center";
  ctx.lineWidth=6;ctx.strokeStyle="#3d0000";
  ctx.fillStyle="#ff5a5a";ctx.font="900 56px system-ui";
  ctx.strokeText("GAME OVER",W/2,120);ctx.fillText("GAME OVER",W/2,120);
  drawSolana(W/2-170,180,16);
  ctx.fillStyle="#eafff5";ctx.font="bold 32px system-ui";
  ctx.fillText("SOLANA collected: "+solana,W/2+20,192);
  ctx.fillStyle="#ffd76a";ctx.font="bold 22px system-ui";
  ctx.fillText("Distance: "+Math.floor(dist/50)+" m  •  Best: "+best,W/2,236);
  const r=myRank();
  ctx.fillStyle="#9fffd9";ctx.font="bold 20px system-ui";
  ctx.fillText((r>0?"Leaderboard rank: #"+r:"")+(user?"  ("+shortName(user.name)+")":""),W/2,272);
  ctx.fillStyle="#14f195";ctx.font="bold 18px system-ui";
  ctx.fillText("Score sent to the leaderboard ✓",W/2,308);
  ctx.fillText("🏆 Top players will be rewarded at the $COMEBACK launch!",W/2,336);
  if(tGlobal-deathTime>.5){ctx.fillStyle=Math.sin(tGlobal*6)>0?"#ffffff":"#9fffd9";ctx.font="bold 24px system-ui";ctx.fillText("SPACE / TAP to restart",W/2,400);}
  ctx.textAlign="left";
}
function drawWin(){
  ctx.fillStyle="rgba(3,10,18,.88)";ctx.fillRect(0,0,W,H);
  ctx.textAlign="center";
  ctx.lineWidth=6;ctx.strokeStyle="#043d22";
  ctx.fillStyle="#14f195";ctx.font="900 54px system-ui";
  ctx.strokeText("YOU WIN! 🚀",W/2,140);ctx.fillText("YOU WIN! 🚀",W/2,140);
  ctx.fillStyle="#ffd76a";ctx.font="bold 26px system-ui";
  ctx.fillText("$COMEBACK TO THE MOON!",W/2,186);
  drawSolana(W/2-150,240,16);
  ctx.fillStyle="#eafff5";ctx.font="bold 30px system-ui";
  ctx.fillText("Total SOLANA: "+solana,W/2+20,250);
  const r=myRank();
  ctx.fillStyle="#9fffd9";ctx.font="bold 20px system-ui";
  ctx.fillText((r>0?"Leaderboard: #"+r:"")+(user?"  ("+shortName(user.name)+")":""),W/2,292);
  ctx.fillStyle="#14f195";ctx.font="bold 18px system-ui";
  ctx.fillText("🏆 You're on the launch reward list!",W/2,326);
  if(tGlobal-deathTime>.5){ctx.fillStyle=Math.sin(tGlobal*6)>0?"#ffffff":"#9fffd9";ctx.font="bold 24px system-ui";ctx.fillText("SPACE / TAP to play again",W/2,400);}
  ctx.textAlign="left";
}
function drawClear(){
  ctx.fillStyle="rgba(3,10,18,.8)";ctx.fillRect(0,0,W,H);
  ctx.textAlign="center";
  ctx.lineWidth=6;ctx.strokeStyle="#000";
  ctx.fillStyle=PAL().line;ctx.font="900 50px system-ui";
  ctx.strokeText("LEVEL "+level+" COMPLETE!",W/2,H/2-30);
  ctx.fillText("LEVEL "+level+" COMPLETE!",W/2,H/2-30);
  ctx.fillStyle="#eafff5";ctx.font="bold 24px system-ui";
  ctx.fillText("+1 ❤  •  Next: "+PALS[Math.min(4,level)].name,W/2,H/2+20);
  ctx.textAlign="left";
}

/* ---- RENDER ---- */
function render(){
  const P=PAL();
  ctx.drawImage(getBG(level),0,0);
  stars.forEach(function(s){ctx.globalAlpha=.35+.6*Math.abs(Math.sin(tGlobal*2+s.tw));ctx.fillStyle="#bfffe2";ctx.fillRect(s.x,s.y,s.r,s.r);});ctx.globalAlpha=1;
  ctx.drawImage(GLOW_MOON,750,6,160,160);
  ctx.fillStyle="#d9ffe9";ctx.beginPath();ctx.arc(830,86,32,0,7);ctx.fill();
  ctx.fillStyle="rgba(140,200,170,.5)";
  ctx.beginPath();ctx.arc(820,78,7,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(840,96,5,0,7);ctx.fill();
  rockets.forEach(drawRocket);
  ctx.fillStyle="rgba(7,27,38,.9)";skyline.forEach(function(b){ctx.fillRect(b.x,GROUND-b.h-30,b.w,b.h+30);});
  bgCandles.forEach(function(c){ctx.fillStyle=P.candle;ctx.fillRect(c.x,GROUND-40-c.h,c.w,c.h);ctx.fillRect(c.x+c.w/2-1,GROUND-40-c.h-14,2,c.h+28);});
  ctx.globalAlpha=.25;ctx.fillStyle=P.line;ctx.fillRect(0,GROUND-6,W,16);ctx.globalAlpha=1;
  ctx.fillStyle=P.line;ctx.fillRect(0,GROUND,W,4);
  ctx.fillStyle="rgba(255,255,255,.14)";const off=-(dist%48);for(let x=off;x<W;x+=48)ctx.fillRect(x,GROUND+24,24,6);
  if(state==="play"&&speed>500){ctx.strokeStyle="#9fffd9";ctx.lineWidth=2;ctx.globalAlpha=Math.min(.3,(speed-500)/900);streaks.forEach(function(s){const x=W-((tGlobal*s.sp)%(W+s.l));ctx.beginPath();ctx.moveTo(x,s.y);ctx.lineTo(x+s.l,s.y);ctx.stroke();});ctx.globalAlpha=1;}
  coins.forEach(function(c){drawSolana(c.x,c.y+Math.sin(tGlobal*4+c.t)*4,c.r);});
  powersArr.forEach(function(p){drawPowerIcon(p.type,p.x,p.y,p.r);});
  obstacles.forEach(drawObstacle);
  enemies.forEach(drawEnemy);
  if(boss)drawBoss(boss);
  drawPlayer();
  if(beam&&beam.life>0){const g=ctx.createLinearGradient(player.x,0,W,0);g.addColorStop(0,"rgba(36,255,126,.9)");g.addColorStop(1,"rgba(36,255,126,0)");ctx.fillStyle=g;ctx.fillRect(player.x+20,beam.y-4,W-player.x,8);ctx.fillStyle="#eafff5";ctx.fillRect(player.x+20,beam.y-1.5,W-player.x,3);}
  parts.forEach(function(p){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,p.s,p.s);});ctx.globalAlpha=1;
  floats.forEach(function(f){ctx.globalAlpha=Math.max(0,Math.min(1,f.life));ctx.fillStyle=f.col;ctx.font="bold 20px system-ui";ctx.textAlign="center";ctx.fillText(f.txt,f.x,f.y);});
  ctx.globalAlpha=1;ctx.textAlign="left";
  drawSolana(34,36,14);ctx.fillStyle="#eafff5";ctx.font="bold 26px system-ui";ctx.fillText(String(solana),58,45);
  for(let i=0;i<3;i++)heart(38+i*28,72,10,i<hearts?"#ff5a5a":"rgba(255,255,255,.18)");
  ctx.textAlign="right";ctx.fillStyle=P.line;ctx.fillText(Math.floor(dist/50)+" m",W-20,40);
  ctx.fillStyle="#ffd76a";ctx.font="bold 20px system-ui";ctx.fillText("Best: "+best,W-20,68);
  ctx.textAlign="left";
  if(state==="play"&&!bossSpawned){const pw2=260,px=W/2-pw2/2;ctx.fillStyle="rgba(0,0,0,.4)";ctx.fillRect(px,14,pw2,8);ctx.fillStyle=P.line;ctx.fillRect(px,14,pw2*Math.min(1,levelDist/LEVEL_LEN[level-1]),8);ctx.strokeStyle="rgba(255,255,255,.5)";ctx.lineWidth=1;ctx.strokeRect(px,14,pw2,8);ctx.fillStyle="#fff";ctx.font="bold 12px system-ui";ctx.textAlign="center";ctx.fillText("LV "+level+" — "+P.name,W/2,36);ctx.textAlign="left";}
  ctx.drawImage(vig,0,0);
  if(state==="play"){
    drawHUDPowers();
    drawGameButton(BTN_A.x,BTN_A.y,BTN_A.r,P.line,iconFist,"PUNCH • X");
    drawGameButton(BTN_MENU.x,BTN_MENU.y,BTN_MENU.r,"#ff5a5a",iconBack,"MENU • ESC");
  }
  if(state==="menu")drawMenu();
  if(state==="over")drawOver();
  if(state==="win")drawWin();
  if(state==="levelclear")drawClear();
  ctx.textAlign="left";
}

/* ---- INPUT & LOOP ---- */
function jump(){
  if(!user)return;if(state==="menu"){reset();return;}
  if(state==="over"||state==="win"){if(tGlobal-deathTime>.5)reset();return;}
  if(state==="levelclear")return;if(powers.rocket>0)return;
  if(player.on)doJump();else if(!superUsed)doSuper();else bufferT=BUFFER;
}
window.addEventListener("keydown",function(e){
  if(e.code==="KeyM"){musicOn=!musicOn;return;}
  if(e.code==="Escape"){goToMenu();return;}
  if(e.code==="Space"||e.code==="ArrowUp"||e.code==="KeyW"){e.preventDefault();jump();}
  if(e.code==="KeyX"||e.code==="KeyK"||e.code==="KeyJ"){e.preventDefault();attack();}
});
cv.addEventListener("pointerdown",function(e){
  e.preventDefault();const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)*(W/r.width),y=(e.clientY-r.top)*(H/r.height);
  if(state==="play"){
    if(Math.hypot(x-BTN_A.x,y-BTN_A.y)<BTN_A.r+10){attack();return;}
    if(Math.hypot(x-BTN_MENU.x,y-BTN_MENU.y)<BTN_MENU.r+10){goToMenu();return;}
  }
  jump();
});
function loop(ts){const dt=Math.min(.033,(ts-last)/1000||.016);last=ts;update(dt);render();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
